<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | NearKart</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body data-page="login">

  <div id="site-header"></div>

  <main class="auth-wrap">
    <div class="auth-card card">
      <div class="role-tabs">
        <button type="button" data-role="customer">👤 Customer</button>
        <button type="button" data-role="owner">🏪 Shop Owner</button>
      </div>

      <h1 id="authTitle">Customer Login</h1>

      <form id="loginForm" class="nk-form">
        <label>Email
          <input type="email" name="email" placeholder="you@example.com" required>
        </label>
        <label>Password
          <input type="password" name="password" placeholder="Your password" required>
        </label>
        <p class="form-error" id="authError"></p>
        <button type="submit" class="btn-submit full">Login</button>
      </form>

      <p class="auth-switch">New here? <a id="switchLink" href="signup.html">Create an account</a></p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="auth.js"></script>
</body>
</html>
